{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FoodDelivery{% endblock %} | FoodDelivery</title>

  <!-- Bootstrap 5 y Bootstrap Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos propios (archivo estático de la app) -->
  <link rel="stylesheet" href="{% static 'catalogo/css/estilos.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Barra de navegación -->
  <nav class="navbar navbar-expand-md navbar-dark bg-marca sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'catalogo:home' %}">
        <i class="bi bi-bag-heart-fill"></i> FoodDelivery
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
               href="{% url 'catalogo:home' %}"><i class="bi bi-house-door"></i> Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'lista' %}active{% endif %}"
               href="{% url 'catalogo:lista' %}"><i class="bi bi-grid-3x3-gap"></i> Catálogo</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido de cada página -->
  <main class="flex-grow-1">
    {% block contenido %}{% endblock %}
  </main>

  <!-- Pie de página -->
  <footer class="bg-dark text-white-50 py-4 mt-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2 small">
      <span><i class="bi bi-bag-heart"></i> FoodDelivery &copy; {% now "Y" %}</span>
      <span><i class="bi bi-code-slash"></i> IS093A - Semana 11 - Django 5.2</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
